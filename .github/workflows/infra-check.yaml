# =============================================================================
# CI/CD: Terraform Infrastructure Validation
# =============================================================================
# Runs on every Pull Request targeting main/develop branches.
# Steps: format check → init → validate → plan
# =============================================================================
name: "Terraform Infrastructure Check"

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "*.tf"
      - "modules/**"
      - "kind-config.yaml"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_LOG: INFO
  TF_VAR_kafka_password: ${{ secrets.KAFKA_PASSWORD }}
  TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
  TF_VAR_cassandra_password: ${{ secrets.CASSANDRA_PASSWORD }}

jobs:
  terraform-check:
    name: "Validate Terraform Configuration"
    runs-on: ubuntu-latest

    steps:
      # --- Checkout ---
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Setup Terraform ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      # --- Format Check ---
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      # --- Init (no backend) ---
      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      # --- Validate ---
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # --- Plan (dry run) ---
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="kafka_password=ci-placeholder" \
            -var="redis_password=ci-placeholder" \
            -var="cassandra_password=ci-placeholder"
        continue-on-error: true

      # --- PR Comment with Results ---
      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### 🔍 Terraform Validation Results

            | Step | Status |
            |------|--------|
            | 🖌 Format | \`${{ steps.fmt.outcome }}\` |
            | ⚙️ Init | \`${{ steps.init.outcome }}\` |
            | ✅ Validate | \`${{ steps.validate.outcome }}\` |
            | 📋 Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # --- Fail if any check failed ---
      - name: Check Results
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
